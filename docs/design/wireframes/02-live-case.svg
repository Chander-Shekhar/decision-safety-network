<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe 02: quiet live case meets a proposed payment</title>
  <desc id="desc">Desktop case view shows controlled incremental transcript, source-linked and correctable facts, and a simulated new-payee transfer. The case is still checking; suspicious language alone has not triggered an enhanced pause.</desc>
  <style>
    .bg{fill:#f3f6f6}.shell,.card{fill:#fff;stroke:#cbd6d7;stroke-width:2}.soft{fill:#f3f7f7}.line{stroke:#dce4e5;stroke-width:1.5}.ink{fill:#18313a}.muted{fill:#5c7077}.teal{fill:#166d67}.tealbg{fill:#e3f3ef}.button{fill:#176d67}.buttonText{fill:#fff}.chip{fill:#eff4f4;stroke:#cbd6d7}.amber{fill:#fff4e6}.section{font:700 22px system-ui,sans-serif}.body{font:16px system-ui,sans-serif}.small{font:14px system-ui,sans-serif}.tiny{font:12px system-ui,sans-serif}.label{font:600 16px system-ui,sans-serif}.heading{font:700 32px system-ui,sans-serif}
  </style>
  <rect class="bg" width="1280" height="900"/>
  <text x="42" y="54" class="heading ink">02 / The case evolves quietly</text>
  <text x="43" y="82" class="body muted">Desktop wide layout · conversation and transaction become one case, not one alarm</text>
  <rect x="40" y="112" width="1200" height="735" rx="18" class="shell"/>
  <text x="66" y="153" class="label ink">Safety Case DSN-1042</text>
  <rect x="286" y="130" width="92" height="30" rx="15" class="chip"/>
  <text x="298" y="151" class="tiny ink">REVIEWING</text>
  <text x="852" y="150" class="small muted">Controlled input · Processing live</text>
  <line x1="41" y1="174" x2="1239" y2="174" class="line"/>

  <rect x="62" y="194" width="377" height="630" rx="14" class="card"/>
  <text x="82" y="232" class="section ink">Live session</text>
  <text x="82" y="257" class="small muted">Controlled transcript · segments arrive one at a time</text>
  <rect x="82" y="279" width="337" height="97" rx="10" class="soft"/>
  <text x="98" y="304" class="tiny teal">CALLER · SOURCE 01 · 10:12</text>
  <text x="98" y="330" class="body ink">“I am from Demo Bank's fraud team.</text>
  <text x="98" y="352" class="body ink">Your account is compromised.”</text>
  <rect x="82" y="392" width="337" height="100" rx="10" class="soft"/>
  <text x="98" y="418" class="tiny teal">CALLER · SOURCE 02 · 10:13</text>
  <text x="98" y="443" class="body ink">“Do not tell anyone. We need to</text>
  <text x="98" y="465" class="body ink">handle this immediately.”</text>
  <rect x="82" y="508" width="337" height="118" rx="10" class="soft"/>
  <text x="98" y="534" class="tiny teal">CALLER · SOURCE 03 · 10:14</text>
  <text x="98" y="558" class="body ink">“Transfer ₹50,000 to safe-new,</text>
  <text x="98" y="580" class="body ink">a new safe account.”</text>
  <text x="98" y="604" class="tiny muted">Transcript text is untrusted input</text>
  <line x1="82" y1="653" x2="419" y2="653" class="line"/>
  <text x="82" y="683" class="label ink">Session controls</text>
  <rect x="82" y="699" width="159" height="44" rx="8" class="card"/>
  <text x="114" y="727" class="small ink">Stop processing</text>
  <rect x="254" y="699" width="165" height="44" rx="8" class="card"/>
  <text x="281" y="727" class="small ink">Review sources</text>
  <text x="82" y="780" class="small muted">No microphone or always-on capture.</text>

  <rect x="454" y="194" width="361" height="630" rx="14" class="card"/>
  <text x="475" y="232" class="section ink">Decision Map</text>
  <text x="475" y="258" class="small muted">AI suggests; you confirm what was said.</text>
  <rect x="475" y="280" width="319" height="109" rx="10" class="soft"/>
  <text x="491" y="304" class="tiny teal">CALLER CLAIMED · SOURCE 01</text>
  <text x="491" y="330" class="body ink">“Account compromised”</text>
  <text x="491" y="354" class="small muted">Not independently verified</text>
  <text x="491" y="376" class="small teal">View source · Correct · Confirm caller claim</text>
  <rect x="475" y="402" width="319" height="109" rx="10" class="soft"/>
  <text x="491" y="427" class="tiny teal">REQUESTED ACTION · SOURCE 03</text>
  <text x="491" y="453" class="body ink">Transfer ₹50,000 to safe-new</text>
  <text x="491" y="478" class="small teal">View source · Correct</text>
  <text x="491" y="499" class="small teal">Confirm payee · Confirm amount</text>
  <rect x="475" y="524" width="319" height="96" rx="10" class="soft"/>
  <text x="491" y="549" class="tiny teal">OBSERVED TACTICS · SOURCE 02</text>
  <text x="491" y="574" class="body ink">Secrecy · urgency</text>
  <text x="491" y="598" class="small teal">View source · Correct</text>
  <rect x="475" y="635" width="319" height="77" rx="10" class="chip"/>
  <text x="491" y="660" class="tiny muted">VERIFICATION STATUS</text>
  <text x="491" y="686" class="body ink">Unknown · no bank check yet</text>
  <text x="475" y="765" class="small muted">Source IDs and corrections travel with the case.</text>

  <rect x="830" y="194" width="388" height="630" rx="14" class="card"/>
  <text x="851" y="232" class="section ink">Transfer draft</text>
  <rect x="1036" y="209" width="162" height="32" rx="16" class="chip"/>
  <text x="1068" y="230" class="tiny ink">SIMULATED</text>
  <text x="851" y="269" class="small muted">No money moves in this prototype.</text>
  <text x="851" y="323" class="label ink">Beneficiary</text>
  <rect x="851" y="337" width="345" height="58" rx="9" class="card"/>
  <text x="869" y="373" class="body ink">safe-new · new payee</text>
  <text x="851" y="430" class="label ink">Amount</text>
  <rect x="851" y="444" width="345" height="58" rx="9" class="card"/>
  <text x="869" y="480" class="body ink">₹ 50,000</text>
  <rect x="851" y="525" width="345" height="78" rx="10" class="amber"/>
  <text x="869" y="550" class="label ink">Still checking the connection</text>
  <text x="869" y="574" class="small ink">No enhanced Pause from words alone.</text>
  <rect x="851" y="632" width="345" height="61" rx="10" class="button"/>
  <text x="943" y="669" class="label buttonText">Submit intent</text>
  <text x="851" y="722" class="small muted">This begins a pending human decision,</text>
  <text x="851" y="742" class="small muted">not an authorized payment or real hold.</text>
  <text x="851" y="791" class="small teal">I already paid → recovery in this case</text>
  <text x="43" y="881" class="small muted">Design note: three columns collapse to action-first stacked sections on narrow screens.</text>
</svg>
